# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: false
  jobs:
    - name: oxlint
      glob: "*.{js,jsx,ts,tsx,mjs,cjs}"
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    - name: oxfmt
      run: pnpm exec oxfmt --write {staged_files}
      stage_fixed: true
