name: Nightly Mobile Release

on:
  schedule:
    # Daily at 03:00 Mexico City time (UTC-6) -> 09:17 UTC
    # Offset from :00 to avoid GitHub Actions top-of-hour cron queue delays.
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build and publish even if there are no new mobile-relevant commits since the last nightly"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: nightly-mobile-release
  cancel-in-progress: false

jobs:
  check-changes:
    name: Check for mobile changes
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      head_sha: ${{ steps.check.outputs.head_sha }}
      short_sha: ${{ steps.check.outputs.short_sha }}
      previous_sha: ${{ steps.check.outputs.previous_sha }}
      build_date: ${{ steps.check.outputs.build_date }}
      app_version: ${{ steps.check.outputs.app_version }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true

      - name: Determine whether to build nightly
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_BUILD: ${{ inputs.force }}
        run: |
          set -euo pipefail

          HEAD_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          BUILD_DATE="$(date -u +%Y%m%d)"
          APP_VERSION="1.0.0-nightly.${BUILD_DATE}.${SHORT_SHA}"

          PREV_SHA=""
          if git rev-parse --verify --quiet refs/tags/nightly >/dev/null; then
            PREV_SHA="$(git rev-parse 'refs/tags/nightly^{commit}')"
          fi

          SHOULD_BUILD="false"
          REASON=""

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$FORCE_BUILD" == "true" ]]; then
            SHOULD_BUILD="true"
            REASON="Manual workflow_dispatch with force=true"
          elif [[ -z "$PREV_SHA" ]]; then
            SHOULD_BUILD="true"
            REASON="No previous nightly tag found; creating initial nightly release"
          elif [[ "$PREV_SHA" == "$HEAD_SHA" ]]; then
            SHOULD_BUILD="false"
            REASON="master is already at the last nightly commit (${SHORT_SHA})"
          else
            CHANGED_FILES="$(git diff --name-only "$PREV_SHA" "$HEAD_SHA" -- \
              apps/native \
              packages \
              package.json \
              pnpm-lock.yaml \
              pnpm-workspace.yaml)"

            if [[ -n "$CHANGED_FILES" ]]; then
              SHOULD_BUILD="true"
              REASON="Mobile-relevant changes detected since ${PREV_SHA:0:7}"
            else
              SHOULD_BUILD="false"
              REASON="New commits on master since ${PREV_SHA:0:7}, but none touch mobile-relevant paths"
            fi
          fi

          {
            echo "should_build=${SHOULD_BUILD}"
            echo "head_sha=${HEAD_SHA}"
            echo "short_sha=${SHORT_SHA}"
            echo "previous_sha=${PREV_SHA}"
            echo "build_date=${BUILD_DATE}"
            echo "app_version=${APP_VERSION}"
            echo "reason=${REASON}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Nightly Release Check"
            echo ""
            echo "- **Should build**: \`${SHOULD_BUILD}\`"
            echo "- **Reason**: ${REASON}"
            echo "- **Head SHA**: \`${HEAD_SHA}\`"
            echo "- **Previous nightly SHA**: \`${PREV_SHA:-none}\`"
            echo "- **Target version**: \`${APP_VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  quality-gates:
    name: Typecheck & lint
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-changes.outputs.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types (native & shared packages)
        run: pnpm --filter @cozi/native... check-types

      - name: Lint (native & shared packages)
        run: pnpm exec oxlint apps/native packages

  build-android:
    name: Build Android APK
    needs: [check-changes, quality-gates]
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Validate required repository variables and secrets
        shell: bash
        env:
          EXPO_PUBLIC_CONVEX_URL: ${{ vars.EXPO_PUBLIC_CONVEX_URL }}
          EXPO_PUBLIC_CONVEX_SITE_URL: ${{ vars.EXPO_PUBLIC_CONVEX_SITE_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()

          [[ -z "${EXPO_PUBLIC_CONVEX_URL}" ]] && missing+=("vars.EXPO_PUBLIC_CONVEX_URL")
          [[ -z "${EXPO_PUBLIC_CONVEX_SITE_URL}" ]] && missing+=("vars.EXPO_PUBLIC_CONVEX_SITE_URL")
          [[ -z "${ANDROID_KEYSTORE_BASE64}" ]] && missing+=("secrets.ANDROID_KEYSTORE_BASE64")
          [[ -z "${ANDROID_KEYSTORE_PASSWORD}" ]] && missing+=("secrets.ANDROID_KEYSTORE_PASSWORD")
          [[ -z "${ANDROID_KEY_ALIAS}" ]] && missing+=("secrets.ANDROID_KEY_ALIAS")
          [[ -z "${ANDROID_KEY_PASSWORD}" ]] && missing+=("secrets.ANDROID_KEY_PASSWORD")

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required GitHub Actions configuration: ${missing[*]}. See docs/nightly-releases.md for setup instructions."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-changes.outputs.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Decode Android upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/cozi-upload.keystore"

      - name: Expo prebuild (Android)
        working-directory: apps/native
        env:
          APP_VARIANT: nightly
          APP_VERSION: ${{ needs.check-changes.outputs.app_version }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          NODE_ENV: production
          EXPO_PUBLIC_CONVEX_URL: ${{ vars.EXPO_PUBLIC_CONVEX_URL }}
          EXPO_PUBLIC_CONVEX_SITE_URL: ${{ vars.EXPO_PUBLIC_CONVEX_SITE_URL }}
        run: pnpm exec expo prebuild --platform android --clean --non-interactive

      - name: Build signed release APK
        working-directory: apps/native/android
        env:
          APP_VARIANT: nightly
          APP_VERSION: ${{ needs.check-changes.outputs.app_version }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          NODE_ENV: production
          EXPO_PUBLIC_CONVEX_URL: ${{ vars.EXPO_PUBLIC_CONVEX_URL }}
          EXPO_PUBLIC_CONVEX_SITE_URL: ${{ vars.EXPO_PUBLIC_CONVEX_SITE_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            --no-daemon \
            -PCOZI_UPLOAD_STORE_FILE="$RUNNER_TEMP/cozi-upload.keystore" \
            -PCOZI_UPLOAD_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PCOZI_UPLOAD_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PCOZI_UPLOAD_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

      - name: Verify APK signature and stage artifact
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="apps/native/android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$APK_PATH" ]]; then
            echo "::error::Expected APK not found at $APK_PATH"
            exit 1
          fi

          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::Could not locate apksigner in Android SDK build-tools"
            exit 1
          fi

          CERT_INFO="$("$APKSIGNER" verify --print-certs "$APK_PATH")"
          echo "$CERT_INFO"
          if grep -q "CN=Android Debug" <<< "$CERT_INFO"; then
            echo "::error::Release APK was signed with the Android Debug keystore instead of the upload keystore."
            exit 1
          fi

          cp "$APK_PATH" "$RUNNER_TEMP/cozi-nightly.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cozi-nightly-android
          path: ${{ runner.temp }}/cozi-nightly.apk
          retention-days: 1
          if-no-files-found: error

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/cozi-upload.keystore"

  publish-release:
    name: Publish rolling nightly release
    needs: [check-changes, build-android]
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-changes.outputs.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: cozi-nightly-android
          path: ${{ runner.temp }}/release-assets

      - name: Generate release notes
        shell: bash
        env:
          HEAD_SHA: ${{ needs.check-changes.outputs.head_sha }}
          SHORT_SHA: ${{ needs.check-changes.outputs.short_sha }}
          PREV_SHA: ${{ needs.check-changes.outputs.previous_sha }}
          APP_VERSION: ${{ needs.check-changes.outputs.app_version }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          APK_FILE="$RUNNER_TEMP/release-assets/cozi-nightly.apk"
          APK_SHA256="$(sha256sum "$APK_FILE" | awk '{print $1}')"
          BUILT_AT="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          {
            echo "## Cozi Nightly (Android)"
            echo ""
            echo "Automated nightly build of \`apps/native\` from \`master\`."
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| **Version** | \`${APP_VERSION}\` |"
            echo "| **Android versionCode** | \`${VERSION_CODE}\` |"
            echo "| **Package ID** | \`com.cozi.app.nightly\` |"
            echo "| **Commit** | \`${HEAD_SHA}\` |"
            echo "| **Built at** | ${BUILT_AT} |"
            echo "| **APK SHA-256** | \`${APK_SHA256}\` |"
            echo ""
            echo "### Changes"
            echo ""
            if [[ -n "$PREV_SHA" && "$PREV_SHA" != "$HEAD_SHA" ]]; then
              git log --no-merges --pretty=format:"- \`%h\` %s (%an)" "${PREV_SHA}..${HEAD_SHA}"
            else
              git log -n 20 --no-merges --pretty=format:"- \`%h\` %s (%an)" "$HEAD_SHA"
            fi
            echo ""
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Update nightly tag and GitHub Pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.check-changes.outputs.head_sha }}
          APP_VERSION: ${{ needs.check-changes.outputs.app_version }}
        run: |
          set -euo pipefail
          APK_FILE="$RUNNER_TEMP/release-assets/cozi-nightly.apk"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"

          git tag -f nightly "$HEAD_SHA"
          git push origin --force refs/tags/nightly

          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly \
              --title "Cozi Nightly (${APP_VERSION})" \
              --notes-file "$NOTES_FILE" \
              --prerelease
            gh release upload nightly "$APK_FILE" --clobber
          else
            gh release create nightly "$APK_FILE" \
              --title "Cozi Nightly (${APP_VERSION})" \
              --notes-file "$NOTES_FILE" \
              --prerelease
          fi

          {
            echo "## Published Nightly Release"
            echo ""
            echo "- **Release**: https://github.com/${GITHUB_REPOSITORY}/releases/tag/nightly"
            echo "- **Direct APK**: https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/cozi-nightly.apk"
            echo "- **Version**: \`${APP_VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
